# T2 假模型行为层 overlay（票据 06；计划 §3.1）——叠在 headless profile 之上：
#
#   node gates/stub/run.mjs --scenario bash-first-call
#   scripts/regression-gate.sh --tier 2
#
# 遏制规则（Q13）：假模型只出现在本文件与同目录模块里；provider 名固定 `stub`，
# 不占用任何真实路由。`./adapter.mjs` 由加载器锚定到本补丁所在目录
# （anchorInsertedPluginNames），换 checkout 仍可解析。
- id: headless-runner
  disabled: true

- id: headless-startup
  disabled: true

# dsh-base 的 tool-bash 与 preset 的 persistent-shell bash 撞名（同 smoke-boot 处置）
- id: tool-bash
  disabled: true

# Q25：首条人类消息后会并发打同一路由，必须关掉，回放序列才确定
- id: session-title-llm
  disabled: true

# 会话落隔离根：runner / 闸门注入 STUB_SESSION_ROOT，缺省落 /tmp，绝不写真实 ~/.dsh
- id: session-persistence-jsonl
  config:
    root: !!js process.env.STUB_SESSION_ROOT ?? '/tmp/dsh-gate-stub-sessions'

# 票据 07：委派策略场景要求策略生效（T1 冒烟共用的 gates/composition/subagent-settings.patch.yml
# 保持 enabled=false）。允许集合只放 T2 自己的 stub 路由；「集合外路由」场景拿它当拒绝面。
- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels:
      - provider: stub
        model: stub-model

- insert:
    # 票据 07：preset 载体改为 0.1.7 bundle（registry + 声明行），由 runner 的临时
    # headless profile 通过 `dsh.profile.bundles` 选择；本 overlay 不再挂旧
    # `@deepseek-ai/dsh-agent-presets`（0.1.7 已移除该包）。
    - id: gate-stub-adapter
      name: ./adapter.mjs
