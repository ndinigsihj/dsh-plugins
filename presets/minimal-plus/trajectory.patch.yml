# headless 跑 minimal-plus 轨迹实测（Phase 3）用的 --patch 覆盖层。
#
# 用法（0.1.7）：profile 必须先选择 preset bundle 并挂宿主侧模型选择单例；独立跑用
#   node scripts/profile-home.mjs --home /tmp/trajectory-home --source presets/minimal-plus --settings-singleton
#   TRAJECTORY_TASK=... DSH_HOME=/tmp/trajectory-home HOME=/tmp/trajectory-home \
#     dsh --profile headless --patch presets/minimal-plus/trajectory.patch.yml
#
# 2026-09-25 票据 11：删除旧 agent-presets 服务插入行（0.1.7 已移除该服务与目录形态，
# TRAJECTORY_PRESET_ROOT 随之失效），preset 由 profile 的 bundle 选择提供；
# driver 由 patch 文件位置锚定。
#
# 票 05：会话写隔离根（TRAJECTORY_SESSION_ROOT，默认 /tmp/dsh-probe/trajectory-sessions），
# 不再写真实 ~/.dsh/sessions；报告默认归档到 <repo>/experiments/regression-gate/（TRAJECTORY_OUT 可覆盖）。
- id: headless-runner
  disabled: true

- id: headless-startup
  disabled: true

# dsh-base 的 tool-bash 会与 preset 的 bash 撞名 → 与 smoke-boot 同处置
- id: tool-bash
  disabled: true

# 票 05：会话隔离写（范式同票 11/12 探针与票 02 seeded 探针）
- id: session-persistence-jsonl
  config:
    root: !!js process.env.TRAJECTORY_SESSION_ROOT ?? '/tmp/dsh-probe/trajectory-sessions'

- insert:
    - id: liangshen-trajectory
      name: ./trajectory-driver.mjs