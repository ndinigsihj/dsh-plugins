# headless 跑 minimal-plus-next 轨迹实测（Phase 3）用的 --patch 覆盖层。
#
# 用法：TRAJECTORY_TASK=... \
#   dsh --profile headless --patch presets/minimal-plus-next/trajectory.patch.yml
#
# 路径不写死：preset 根由 TRAJECTORY_PRESET_ROOT 覆盖，默认取相对当前工作目录的
# presets（文档约定的调用方式即在仓库根执行）；driver 由 patch 文件位置锚定。
#
# 票 05：会话写隔离根（TRAJECTORY_SESSION_ROOT，默认 /tmp/dsh-probe/trajectory-sessions），
# 不再写真实 ~/.dsh/sessions；报告默认归档到 <repo>/experiments/regression-gate/（TRAJECTORY_OUT 可覆盖）。
- id: headless-runner
  disabled: true

- id: headless-startup
  disabled: true

# dsh-base 的 tool-bash 会与 preset 的 bash 撞名 → 与 smoke-boot 同处置
- id: tool-bash
  disabled: true

# 票 05：会话隔离写（范式同票 11/12 探针与票 02 seeded 探针）
- id: session-persistence-jsonl
  config:
    root: !!js process.env.TRAJECTORY_SESSION_ROOT ?? '/tmp/dsh-probe/trajectory-sessions'

- insert:
    - id: agent-presets
      name: "@deepseek-ai/dsh-agent-presets"
      config:
        default: minimal-plus-next
        roots:
          - path: !!js process.env.TRAJECTORY_PRESET_ROOT ?? 'presets'
            trust: system
        includeUserRoot: true

    - id: liangshen-trajectory
      name: ./trajectory-driver.mjs