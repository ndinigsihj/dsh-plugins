# 票据 11 行为探针 overlay（在 0.1.7 headless profile 之上）：
#   dsh --profile headless --patch experiments/subagent-model-selection/probe.patch.yml
# profile 必须已选择 preset bundle，并以 **profile 层** config 挂好宿主侧模型选择单例
# （部署基线 = allowed-routes.mjs）—— 不能放本 overlay：被命令行 overlay 覆盖的条目会被
# settings 编辑器拒写，a9「事后编辑设置」检查需要 user 层可写。独立跑用
#   node scripts/profile-home.mjs --home /tmp/dsh-ticket11/home --source presets/minimal-plus --settings-config '<json>'
# 预置隔离 home（run.sh 已接线），再以 DSH_HOME/HOME 指过去。
#
# 与 m4.patch.yml 同处置：关掉 stock headless runner/startup，禁用 dsh-base 的
# tool-bash（与 preset 的 persistent-shell bash 撞名）。探针自带三段环境隔离：
#   1) settings.path 指向临时副本 —— 设置编辑测试写副本，不碰 ~/.dsh/settings.yaml；
#   2) session-persistence-jsonl.root 指向临时目录 —— 新探针会话与旧会话副本都落
#      临时根，不碰真实 ~/.dsh/sessions（旧会话由 run.sh 或闸门 T3 预复制）；
#   3) 单例的部署基线在 profile patch，overlay 不动它。
# 路径可用 env 覆盖（闸门 `--tier 3` 用 PROBE_SETTINGS_PATH / PROBE_SESSION_ROOT
# 指向自己的隔离临时 home；不设时保持 run.sh 的 /tmp/dsh-ticket11 默认值）。
- id: headless-runner
  disabled: true

- id: headless-startup
  disabled: true

- id: tool-bash
  disabled: true

- id: settings
  config:
    path: !!js process.env.PROBE_SETTINGS_PATH ?? '/tmp/dsh-ticket11/settings.yaml'

- id: session-persistence-jsonl
  config:
    root: !!js process.env.PROBE_SESSION_ROOT ?? '/tmp/dsh-ticket11/sessions'

- insert:
    # 2026-09-25 票据 11：删除旧 agent-presets 服务行（0.1.7 已移除），preset 由 profile
    # 选择的 bundle 提供；本 overlay 只挂探针自身。
    - id: ticket11-probe
      name: ./probe.mjs
