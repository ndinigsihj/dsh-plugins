# M4 对比实验 patch（headless 组合 + 0.1.7 preset 载体，与历史 M4 同口径）。
#
# 用法：profile 必须已选择生成的 preset bundle（`@dsh-plugins/minimal-plus-preset`）——
#   - 闸门 T3 由 `gates/t3/run.mjs` 现场预置 t3-headless profile；
#   - 独立跑先用隔离 home 助手预置（含宿主侧模型选择单例，preset 否则挂不起来）：
#       node scripts/profile-home.mjs --home /tmp/m4-home --source presets/minimal-plus --settings-singleton
#       M4_GROUPS=E M4_RUNS=9 M4_MODEL=commandcode/deepseek/deepseek-v4.1-flash \
#         DSH_HOME=/tmp/m4-home HOME=/tmp/m4-home dsh --profile headless --patch experiments/m4/m4.patch.yml
#
# 2026-09-25 票据 11：删除 `@deepseek-ai/dsh-agent-presets` 插入行（0.1.7 宿主已移除旧
# 服务与目录形态），preset 由 profile 的 bundle 选择提供；E = minimal-plus；
# M4_MODEL 按需覆盖默认路由（见 m4-runner.mjs 头注释）。
#
# 票 05：会话写隔离根（M4_SESSION_ROOT，默认 /tmp/dsh-probe/m4-sessions），
# 不再写真实 ~/.dsh/sessions；报告默认归档到 <repo>/experiments/regression-gate/（M4_OUT 可覆盖）。
- id: headless-runner
  disabled: true

- id: headless-startup
  disabled: true

# dsh-base 的 tool-bash 会与 preset 的 bash 撞名 → 与 smoke/trajectory 同处置
- id: tool-bash
  disabled: true

# 票 05：会话隔离写（范式同票 11/12 探针与票 02 seeded 探针）
- id: session-persistence-jsonl
  config:
    root: !!js process.env.M4_SESSION_ROOT ?? '/tmp/dsh-probe/m4-sessions'

- insert:
    - id: m4-trajectory-runner
      name: ./m4-runner.mjs
